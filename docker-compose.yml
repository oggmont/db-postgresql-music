name: music-db

services:
  postgres:
    image: postgres:17-alpine
    container_name: music-db-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-music}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-music}
      POSTGRES_DB: ${POSTGRES_DB:-music_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Scripts in db/init run once, in alphabetical order, when the data volume is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/queries:/queries:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Check over TCP: during init the server listens on the socket only,
      # so this stays unhealthy until schema + data have finished loading.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  adminer:
    # Web UI for the database: http://localhost:8080
    # Log in with System "PostgreSQL", Server "postgres" and the credentials from .env.
    image: adminer:5
    container_name: music-db-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
